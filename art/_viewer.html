<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pale Horizon art review</title>
<style>
  body { background:#0b0e12; color:#c8cede; font:12px ui-monospace,monospace; padding:16px; }
  h2 { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:#d98a45; margin:18px 0 6px; }
  .row { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
  figure { margin:0; text-align:center; }
  img { image-rendering:pixelated; background:#161a21; border:1px solid #2b323d; }
  figcaption { font-size:10px; color:#8b93a1; margin-top:3px; }
</style>
</head>
<body>
<h2>New ship models</h2>
<div class="row">
  <figure><img src="../game/assets/spr_ship.png" width="384"><figcaption>spr_ship (wreck)</figcaption></figure>
  <figure><img src="../game/assets/spr_ship_fly.png" width="272"><figcaption>spr_ship_fly</figcaption></figure>
</div>
<h2>Pilot: EVA suit vs flight suit</h2>
<div class="row" id="pilots"></div>
<h2>Ship fittings</h2>
<div class="row" id="fittings"></div>
<h2>Field gear and resources</h2>
<div class="row" id="gear"></div>
<script>
const pilots = ["p_idle0","p_walk1","p_jump","c_idle0","c_walk1","c_jump"];
const fittings = ["spr_cryo_pod","spr_nav_console","spr_terminal","spr_cryo_tank","spr_galley","spr_fabricator"];
const gear = ["spr_proc_purify","spr_proc_smelt","spr_proc_melt","spr_biomass","spr_ore","spr_cryo","spr_ration","spr_plate","spr_coolant","spr_fuel","spr_part"];
for (const [el, list, size] of [["pilots", pilots, 110], ["fittings", fittings, 110], ["gear", gear, 86]]) {
  document.getElementById(el).innerHTML = list.map((n) =>
    `<figure><img src="../game/assets/${n}.png" width="${size}"><figcaption>${n}</figcaption></figure>`).join("");
}
</script>
</body>
</html>
